services:
  - type: web
    name: playtrivioqb
    region: virginia
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run serve
    healthCheckPath: /healthz
    envVars:
      # Postgres connection string for accounts (e.g. from neon.tech). Set it in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Your account id, so only that exact account is an admin. The in-game 🛡 Admin panel shows it.
      - key: ADMIN_ACCOUNT_IDS
        sync: false
      # Account emails go out through the Gmail API (Render's free plan blocks SMTP). Setup steps are in README.md.
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Sender shown on those emails, e.g. "Trivio <playtriviosupport@gmail.com>".
      - key: MAIL_FROM
        sync: false
      # Where reset and confirmation links point.
      - key: PUBLIC_URL
        value: https://playtrivioqb.onrender.com
